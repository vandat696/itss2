<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S04 就職活動の歩み</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header data-screen="S04"></header>

<main>
  <h1 class="page-title"><span class="code">S04</span>就職活動の歩み</h1>
  <p class="page-sub">Hành trình tìm việc — プロフィール、求人評価、小さな目標をまとめて確認できます。</p>

  <div class="alert alert-success" id="flash"><span class="alert-msg"></span></div>

  <div class="grid grid-3">
    <section class="card stat">
      <div class="stat-top">
        <span class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </span>
        <div><div class="stat-label">プロフィール</div><div class="stat-value" id="profileSummary">未作成</div></div>
      </div>
      <div class="tags" id="profileSkills"></div>
      <!-- Flow: Cập nhật hồ sơ → S01 -->
      <button class="btn btn-sm" id="btnProfile">プロフィールを更新</button>
    </section>
    <section class="card stat">
      <div class="stat-top">
        <span class="stat-icon violet">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
        </span>
        <div><div class="stat-label">評価中の求人</div><div class="stat-value" id="jobSummary">未評価</div></div>
      </div>
      <!-- Flow: Đánh giá tin tuyển dụng → S02 -->
      <button class="btn btn-sm btn-primary" id="btnJob">求人を評価する →</button>
    </section>
    <section class="card stat">
      <div class="stat-top">
        <span class="stat-icon green">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
        </span>
        <div><div class="stat-label">目標の進捗</div>
          <div class="stat-big"><span id="doneCount">0</span><small> / <span id="totalCount">0</span> 達成</small></div></div>
      </div>
      <div class="progress"><span id="progressBar" style="width:0%"></span></div>
    </section>
  </div>

  <section class="card">
    <div class="card-head">
      <h2>小さな目標 <span class="muted">Cột mốc</span></h2>
      <!-- Flow: Thêm / Mở cột mốc → S05 (from=S04) -->
      <button class="btn btn-sm btn-primary" id="btnAdd">＋ 目標を追加</button>
    </div>
    <div class="timeline" id="milestones"></div>
  </section>
</main>

<script src="assets/app.js"></script>
<script>
  const messages = {
    profile_saved: "プロフィールを保存しました。",
    milestone_saved: "目標を保存しました。",
    milestone_done: "目標を達成として記録しました。",
  };
  const msg = messages[param("msg")];
  if (msg) showAlert("flash", msg);

  const profile = Store.get("profile", null);
  if (profile) {
    $("#profileSummary").textContent = `${profile.name || ""}（${profile.major || ""}）`;
    $("#profileSkills").innerHTML = (profile.skills || []).slice(0, 6)
      .map((s) => `<span class="tag">${escapeHtml(s)}</span>`).join("");
  }
  const job = Store.get("job", null);
  if (job && job.company) $("#jobSummary").textContent = `${job.company} / ${job.position}`;

  const milestones = Store.get("milestones", []);
  const done = milestones.filter((m) => m.status === "done").length;
  $("#doneCount").textContent = done;
  $("#totalCount").textContent = milestones.length;
  $("#progressBar").style.width = milestones.length ? `${(done / milestones.length) * 100}%` : "0%";

  $("#milestones").innerHTML = milestones.length
    ? milestones.map((m) => `
        <div class="item ${m.status === "done" ? "done" : ""}" data-id="${m.id}" role="link" tabindex="0">
          <div>
            <div class="item-title">${escapeHtml(m.title)}</div>
            <div class="muted">📅 ${escapeHtml(m.due || "-")}${m.skill ? ` ・ ${escapeHtml(m.skill)}` : ""}</div>
          </div>
          <span class="tag ${m.status === "done" ? "tag-ok" : "tag-warn"}">${m.status === "done" ? "達成" : "進行中"}</span>
        </div>`).join("")
    : '<p class="empty">🌱 まだ目標がありません。<br>求人を評価して改善目標を作成しましょう。</p>';

  function openItem(e) {
    const item = e.target.closest(".item[data-id]");
    if (item) go("S05", { from: "S04", id: item.dataset.id });
  }
  $("#milestones").addEventListener("click", openItem);
  $("#milestones").addEventListener("keydown", (e) => { if (e.key === "Enter") openItem(e); });

  $("#btnProfile").addEventListener("click", () => go("S01"));
  $("#btnJob").addEventListener("click", () => go("S02"));
  $("#btnAdd").addEventListener("click", () => go("S05", { from: "S04" }));
</script>
</body>
</html>
